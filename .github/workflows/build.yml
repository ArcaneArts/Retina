name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: ./gradlew build
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: retina
          path: build/libs/*.jar
