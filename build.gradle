plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

apply from: 'gradle/native.gradle'
// Shared tests own their Minecraft classpath in common; root tasks remain aliases.
evaluationDependsOn(':common')
project(':common').tasks.matching { it.group == 'verification' && !(it.name in ['check', 'test']) }.each { target ->
    tasks.register(target.name) {
        group = 'verification'
        description = target.description
        dependsOn target
    }
}

tasks.named('assemble') { dependsOn ':fabric:assemble', ':neoforge:assemble' }
tasks.named('check') { dependsOn ':common:check', ':fabric:check', ':neoforge:check' }
tasks.named('build') { dependsOn ':common:build', ':fabric:build', ':neoforge:build' }

['test', 'runClient', 'runServer'].each { name ->
    tasks.register(name) {
        group = name == 'test' ? 'verification' : 'fabric'
        description = "Run the Fabric ${name} task."
        dependsOn ":fabric:${name}"
    }
}
['Client', 'Server'].each { side ->
    tasks.register("runFabric${side}") {
        group = 'fabric'
        dependsOn ":fabric:run${side}"
    }
    tasks.register("runNeoForge${side}") {
        group = 'neoforge'
        dependsOn ":neoforge:runNeoForge${side}"
    }
}
tasks.register('exportFabricBenchmarkProfile') {
    group = 'verification'
    dependsOn ':fabric:exportBenchmarkProfile'
}
