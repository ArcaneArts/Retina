    dependsOn 'nativeGpuTest', 'nativeOreGpuTest', 'nativeCoordinateGpuTest', 'nativeInterpolationGpuTest', 'materialTest', 'aquiferTest', 'gpuTestClasses'
    classpath = sourceSets.gpuTest.runtimeClasspath
    mainClass = 'art.arcane.retina.worldgen.NativeTerrainIntegrationTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

