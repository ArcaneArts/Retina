plugins { id 'java-library' }
apply from: rootProject.file('gradle/java-toolchain.gradle')

// No Minecraft, loader, Bukkit, or parser dependencies belong in this runtime.
base { archivesName = 'retina-core' }
tasks.named('jar') {
    manifest { attributes('Implementation-Version': project.version) }
}

tasks.register('cliTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'art.arcane.retina.core.RetinaCliTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
