// Each loader compiles the same sources against its actual Minecraft runtime.
evaluationDependsOn(':core')
dependencies { implementation project(':core') }
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
processResources {
    from rootProject.tasks.named('packageNative')
    ["vanilla": "vanilla-recompiled", "vanilla-binary": "vanilla-binary"].each { source, snapshot ->
        from(rootProject.file("assets/world-definitions/${minecraft_version}/${source}")) {
            into "catalogs/${minecraft_version}/${snapshot}"
        }
    }
}
base { archivesName = "retina-${project.name}-${minecraft_version}" }
tasks.named('jar') {
    // Flatten the neutral runtime into the loader artifact: no split-package
    // module or second native-library owner is introduced at installation.
    from project(':core').sourceSets.main.output
    manifest { attributes('Implementation-Version': project.version) }
    from rootProject.tasks.named('packageCrossNatives')
    from(rootProject.file('LICENSE')) { rename { "${it}_retina" } }
}
tasks.named('sourcesJar') {
    from project(':core').sourceSets.main.allSource
    exclude 'natives/**'
    from(rootProject.file('native')) {
        include 'Cargo.toml', 'Cargo.lock', 'src/**'
        into 'native'
    }
}
