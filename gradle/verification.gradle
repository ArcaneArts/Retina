// Fresh processes exercise initialization order and the same shared limiter used by all region paths.
[[name: 'Explicit', value: 3, processors: 16, expected: 3],
 [name: 'Automatic', value: 0, processors: 32, expected: 32],
 [name: 'Fraction', value: -3, processors: 16, expected: 6],
 [name: 'Minimum', value: -32, processors: 4, expected: 1]].each { sample ->
    def task = tasks.register("configuredRegion${sample.name}Test", JavaExec) {
        group = 'verification'
        dependsOn regionPreparationClasses
        classpath = files(regionPreparationClasses.flatMap { it.destinationDirectory },
                configurationClasses.flatMap { it.destinationDirectory }) + configurations.configurationLibraries
        mainClass = 'art.arcane.retina.worldgen.ConfiguredRegionBudgetTest'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs "-XX:ActiveProcessorCount=${sample.processors}"
        args sample.value.toString(), sample.expected.toString()
        maxHeapSize = '64m'
        timeout = Duration.ofSeconds(10)
    }
    tasks.named('regionPreparationTest') { dependsOn task }
}
check.dependsOn 'regionPreparationTest'

