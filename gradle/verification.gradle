    classpath = files(worldDefinitionBridgeClasses.flatMap { it.destinationDirectory },
            project(':core').tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'art.arcane.retina.worldgen.NativeWorldDefinitionThreadTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-XX:ActiveProcessorCount=2'
    maxHeapSize = '128m'
    def library = providers.gradleProperty('retinaNativePath')
            .orElse(nativeTarget.map { it.file("release/${System.mapLibraryName('retina_worldgen')}").asFile.absolutePath })
    if (!providers.gradleProperty('retinaNativePath').isPresent()) dependsOn ':buildNative'
    def definition = providers.gradleProperty('retinaThreadDefinition')
            .orElse(rootProject.layout.buildDirectory.file('world-definition-fixtures/vanilla/retina.dat').map { it.asFile.absolutePath })
    if (!providers.gradleProperty('retinaThreadDefinition').isPresent()) dependsOn 'worldDefinitionCompileTest'
    args library.get(), definition.get()
}

check.dependsOn 'worldDefinitionThreadTest'

