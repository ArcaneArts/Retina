['exportVanillaCatalog': false, 'vanillaCatalogFixtures': true].each { taskName, fixtures ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = fixtures ? 'Export a vanilla catalog and independent full-seed Java reference worlds.'
                : 'Explicitly regenerate the bundled vanilla catalog using actual Minecraft registries.'
        dependsOn 'gpuTestClasses'
        classpath = sourceSets.gpuTest.runtimeClasspath
        mainClass = 'art.arcane.retina.worldgen.VanillaCatalogExport'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs '-XX:ActiveProcessorCount=2'
        maxHeapSize = '1g'
        workingDir rootProject.projectDir
        args providers.gradleProperty('catalogOutput').getOrElse(fixtures ? 'build/vanilla-catalog-fixtures'
                : "assets/world-definitions/${minecraft_version}/vanilla")
        if (fixtures) args '--fixtures'
    }
}
