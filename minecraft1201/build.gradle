plugins { id 'net.fabricmc.fabric-loom-remap' }
apply from: rootProject.file('gradle/java-toolchain.gradle')

loom { serverOnlyMinecraftJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
sourceSets {
    main.java.srcDir rootProject.file('definition/src/main/java')
    datagen {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    implementation project(':core17')
}

['exportFlat': 'flat', 'exportNoiseTerrain': 'noise'].each { taskName, mode ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Export a 1.20.1 ${mode} terrain definition from the selected server datapacks."
        dependsOn 'datagenClasses'
        classpath = sourceSets.datagen.runtimeClasspath
        mainClass = 'art.arcane.retina.minecraft1201.RegistryExport'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        jvmArgs '-Djava.awt.headless=true', '-XX:ActiveProcessorCount=2'
        maxHeapSize = '768m'
        args providers.gradleProperty('retinaWorld').getOrElse(layout.buildDirectory.dir("${mode}-export").get().asFile.absolutePath),
             providers.gradleProperty('retinaSeed').getOrElse('12345'), mode,
             providers.gradleProperty('retinaPreset').getOrElse(mode == 'flat' ? 'minecraft:flat' : 'minecraft:normal')
        def verify = mode == 'flat' ? 'retinaVerifyFlat' : 'retinaVerifyNoiseTerrain'
        if (providers.gradleProperty(verify).isPresent()) args '--verify'
        if (providers.gradleProperty('retinaGenerateStructures').isPresent()) args '--structures'
        if (mode == 'noise' && providers.gradleProperty('retinaVerifyJigsaws').isPresent()) {
            args '--structures', '--verify-jigsaws'
        }
        if (mode == 'noise' && providers.gradleProperty('retinaVerifyPortals').isPresent()) {
            args '--structures', '--verify-portals'
        }
        if (mode == 'noise' && providers.gradleProperty('retinaVerifyAttachments').isPresent()) args '--verify-attachments'
        if (mode == 'noise' && providers.gradleProperty('retinaVerifyRings').isPresent()) args '--structures', '--verify-rings'
        if (mode == 'noise' && providers.gradleProperty('retinaVerifyStrongholds').isPresent()) args '--structures', '--verify-strongholds'
        if (mode == 'noise' && providers.gradleProperty('retinaVerifySubmerged').isPresent()) args '--verify-submerged'
        if (mode == 'noise' && providers.gradleProperty('retinaVerifyCoral').isPresent()) args '--verify-coral'
        if (mode == 'flat' && providers.gradleProperty('retinaVerifyFlatWorldgen').isPresent()) {
            args '--structures', '--verify-flat-worldgen'
        }
        if (mode == 'flat' && providers.gradleProperty('retinaVerifySurfaceFreeze').isPresent()) {
            args '--verify-surface-freeze'
        }
        if (providers.gradleProperty('retinaNativePath').isPresent()) {
            systemProperty 'retina.native.path', providers.gradleProperty('retinaNativePath').get()
        }
        if (providers.gradleProperty('retinaGpuBackend').isPresent()) {
            systemProperty 'retina.gpuBackend', providers.gradleProperty('retinaGpuBackend').get()
        }
    }
}

tasks.register('probeEndTerrain', JavaExec) {
    group = 'verification'
    description = 'Sample unmodified 1.20.1 End density, columns and biomes for native comparison.'
    dependsOn 'datagenClasses'
    classpath = sourceSets.datagen.runtimeClasspath
    mainClass = 'art.arcane.retina.minecraft1201.EndTerrainReference'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    jvmArgs '-Djava.awt.headless=true', '-XX:ActiveProcessorCount=2'
    maxHeapSize = '768m'
    args providers.gradleProperty('retinaEndReference').getOrElse(layout.buildDirectory.file('end-reference.json').get().asFile.absolutePath)
}

tasks.register('exportTerrainCatalog', JavaExec) {
    group = 'verification'
    description = 'Export the seed-independent 1.20.1 terrain preview catalog from the vanilla server.'
    dependsOn 'datagenClasses'
    classpath = sourceSets.datagen.runtimeClasspath
    mainClass = 'art.arcane.retina.minecraft1201.CatalogExport'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    jvmArgs '-Djava.awt.headless=true', '-XX:ActiveProcessorCount=2'
    maxHeapSize = '768m'
    def catalog = providers.gradleProperty('retinaCatalog').orElse(
            layout.buildDirectory.file('terrain-catalog/retina-catalog.dat').map { it.asFile.absolutePath })
    args catalog.get()
    outputs.file(catalog)
    if (providers.gradleProperty('retinaVerifyCatalog').isPresent()) {
        args '--verify'
        outputs.upToDateWhen { false }
    }
    if (providers.gradleProperty('retinaNativePath').isPresent()) {
        systemProperty 'retina.native.path', providers.gradleProperty('retinaNativePath').get()
    }
}
