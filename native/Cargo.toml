[package]
name = "retina-worldgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[features]
# Diagnostic reference encodings and standalone GPU ore benchmarks.
ore-raster-benchmark = []
decoration-replay-benchmark = []

[[example]]
name = "ore_raster_benchmark"
required-features = ["ore-raster-benchmark"]

[[example]]
name = "decoration_replay_benchmark"
required-features = ["decoration-replay-benchmark"]

[lib]
name = "retina_worldgen"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
libdeflater = "1"
lz4-sys = "1.11.1"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
smallvec = { version = "1", features = ["union"] }

[profile.release]
lto = "thin"
codegen-units = 2

[profile.dev]
opt-level = 1
codegen-units = 2

[profile.release.build-override]
codegen-units = 2

[profile.dev.build-override]
codegen-units = 2
