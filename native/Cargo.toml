[package]
name = "retina-worldgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[lib]
name = "retina_worldgen"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1
