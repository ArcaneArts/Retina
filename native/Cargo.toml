[package]
name = "retina-worldgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"
publish = false

[features]
default = ["scalable-allocator"]
scalable-allocator = ["dep:mimalloc"]
# Diagnostic reference encodings and standalone GPU ore benchmarks.
ore-raster-benchmark = []
decoration-replay-benchmark = []

[[example]]
name = "ore_raster_benchmark"
required-features = ["ore-raster-benchmark"]

[[example]]
name = "decoration_replay_benchmark"
required-features = ["decoration-replay-benchmark"]

[lib]
name = "retina_worldgen"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "retina"
path = "src/cli/main.rs"

[[bin]]
name = "retina-gpu-probe"
path = "src/bin/gpu_probe.rs"

[dependencies]
profiling = { version = "=1.0.18", features = ["profile-with-tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
libdeflater = "1"
lz4-sys = "1.11.1"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
smallvec = { version = "1", features = ["union"] }
sha2 = "0.10"
fastnbt = "2.6.3"
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# v3 crashes after transient JVM host threads exit (microsoft/mimalloc#1356).
# Non-override v2 uses image-owned TLS instead of macOS's fixed slots.
# Keep dlopen-compatible TLS and no process-wide malloc interposition.
mimalloc = { version = "=0.1.52", optional = true, default-features = false, features = ["local_dynamic_tls", "v2"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { version = "=0.1.52", optional = true, default-features = false, features = ["local_dynamic_tls"] }

# Bundle DXC into the Windows x64 library; no compiler DLL installation is needed.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["static-dxc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
lto = "thin"
codegen-units = 2

[profile.dev]
opt-level = 1
codegen-units = 2

[profile.release.build-override]
codegen-units = 2

[profile.dev.build-override]
codegen-units = 2

# Pinned upstream backend with opt-in, observational DX12 capture/replay hooks.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
