plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
apply from: rootProject.file('gradle/java-conventions.gradle')
apply from: rootProject.file('gradle/loader-sources.gradle')

sourceSets.main {
    java.srcDir rootProject.file('common/src/client/java')
    resources.srcDir rootProject.file('common/src/client/resources')
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            jvmArguments.add '--enable-native-access=ALL-UNNAMED'
            if (providers.gradleProperty('retinaNativePath').isPresent()) systemProperty 'retina.native.path', providers.gradleProperty('retinaNativePath').get()
            // FML creates named mod modules after boot, outside the JVM flag's module lookup.
            // Java 25 permits their FFM calls through this explicit policy.
            jvmArguments.add '--illegal-native-access=allow'
            if (providers.gradleProperty('retinaQa').isPresent()) {
                if (providers.gradleProperty('retinaEndLifecycleQa').isPresent()) systemProperty 'retina.qa.end.lifecycle', 'true'
                if (providers.gradleProperty('retinaEndTravelQa').isPresent()) systemProperty 'retina.qa.end.travel', 'true'
                if (providers.gradleProperty('retinaEndGatewayQa').isPresent()) systemProperty 'retina.qa.end.gateway', 'true'
                if (providers.gradleProperty('retinaEndUnloadQa').isPresent()) systemProperty 'retina.qa.end.unload', 'true'
                if (providers.gradleProperty('retinaEndActivationQa').isPresent()) systemProperty 'retina.qa.end.activation', 'true'
                if (providers.gradleProperty('retinaDefinitionFailCompilerQa').isPresent()) systemProperty 'retina.qa.definition.failCompiler', 'true'
                systemProperty 'retina.qa', 'true'
                [ClientPreset: 'client.preset', ClientNoStructures: 'client.noStructures', ClientVisual: 'client.visual',
                 DefinitionCapture: 'definition.capture', NetherCompatibility: 'nether.compatibility', Automatic: 'automatic', AutomaticReopen: 'automatic.reopen',
                 ClientDatapack: 'client.datapack', ClientServer: 'client.server', ClientHoldSeconds: 'client.holdSeconds',
                 ClientCommands: 'client.commands', ClientOpenExisting: 'client.openExisting', ExpectedFeature: 'expectedFeature', ProfileOutput: 'profileOutput'].each { flag, property ->
                    if (providers.gradleProperty("retina${flag}Qa").isPresent()) systemProperty "retina.qa.${property}", providers.gradleProperty("retina${flag}Qa").get()
                }
                if (providers.gradleProperty('retinaClientGameplayQa').isPresent()) {
                    systemProperty 'retina.qa.client.gameplay', 'true'
                    systemProperty 'retina.qa.client.mode', providers.gradleProperty('retinaClientQaMode').getOrElse('mca')
                }
                if (providers.gradleProperty('retinaNetherLifecycleQa').isPresent()) systemProperty 'retina.qa.nether.lifecycle', 'true'
                if (providers.gradleProperty('retinaNetherPortalDhQa').isPresent()) systemProperty 'retina.qa.nether.portalDh', 'true'
                if (providers.gradleProperty('retinaNetherProgressionQa').isPresent()) systemProperty 'retina.qa.nether.progression', 'true'
                if (providers.gradleProperty('retinaNetherStructuresQa').isPresent()) systemProperty 'retina.qa.nether.structures', 'true'
                if (providers.gradleProperty('retinaNetherUnloadQa').isPresent()) systemProperty 'retina.qa.nether.unload', 'true'
                if (providers.gradleProperty('retinaNetherIntegrationsQa').isPresent()) systemProperty 'retina.qa.nether.integrations', 'true'
                [ClientStartup: 'client.startup', Promotion: 'promotion', Pipeline: 'pipeline',
                 Timings: 'timings', Lighting: 'lighting', Structures: 'structures',
                 StructuresReopen: 'structures.reopen', Entities: 'entities',
                 EntitiesReopen: 'entities.reopen'].each { flag, property ->
                    if (providers.gradleProperty("retina${flag}Qa").isPresent()) {
                        systemProperty "retina.qa.${property}", 'true'
                    }
                }
            }
        }
        neoForgeClient {
            client()
            gameDirectory = rootProject.file(providers.gradleProperty('retinaClientRunDir').getOrElse('run/neoforge-client'))
        }
        neoForgeServer {
            server()
            gameDirectory = rootProject.file(providers.gradleProperty('retinaDatapackQa').getOrElse('run/neoforge-server'))
            programArguments.add '--nogui'
            if (providers.gradleProperty('retinaServerWorldQa').isPresent()) {
                programArguments.addAll(['--universe', 'saves', '--world', providers.gradleProperty('retinaServerWorldQa').get()])
            }
        }
    }
    mods {
        retina { sourceSet sourceSets.main }
    }
}

processResources {
    def metadata = [version: project.version, minecraft_version: minecraft_version, neoforge_version: neoforge_version]
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(metadata) }
}
