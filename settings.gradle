pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'retina'

// Publishing is Git-only: do not configure Minecraft plugins or build modules.
def gitOnlyTasks = ['publish', ':publish', 'releaseRetina', ':releaseRetina', 'release-26', ':release-26']
if (!gradle.startParameter.taskNames.empty && gradle.startParameter.taskNames.every { it in gitOnlyTasks }) {
    rootProject.buildFileName = 'gradle/publish-only.gradle'
} else {
    include 'core', 'core17', 'common', 'fabric', 'neoforge', 'bukkit', 'data', 'universal'
    // Legacy Loom performs Minecraft setup during configuration. Load it only for an explicit legacy build.
    if (providers.gradleProperty('retina1201').isPresent() ||
            gradle.startParameter.taskNames.any { it.startsWith(':minecraft1201:') || it.startsWith('minecraft1201:') }) {
        include 'minecraft1201'
    }
}
