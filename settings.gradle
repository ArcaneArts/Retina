pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'retina'

// Publishing is Git-only: do not configure Minecraft plugins or build modules.
def gitOnlyTasks = ['publish', ':publish', 'releaseRetina', ':releaseRetina']
if (!gradle.startParameter.taskNames.empty && gradle.startParameter.taskNames.every { it in gitOnlyTasks }) {
    rootProject.buildFileName = 'gradle/publish-only.gradle'
} else {
    include 'core', 'common', 'fabric', 'neoforge', 'bukkit', 'data', 'universal'
}
